<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Overlay Link Builder</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="portal-body">
    <main class="portal-card">
      <h1>Overlay + Controlador</h1>
      <p class="muted">Genera o usa un hash en <code>?pass=...</code> para crear tu sesión.</p>

      <section id="no-pass" class="block">
        <p>No se detectó hash de overlay.</p>
        <button id="generate-btn" class="primary-btn" type="button">Generar hash</button>
      </section>

      <section id="with-pass" class="block hidden">
        <p>
          Hash activo:
          <code id="pass-label"></code>
        </p>
        <div class="links">
          <label>Enlace overlay</label>
          <div class="link-row">
            <input id="overlay-link" readonly />
            <button class="copy-btn" data-copy-target="overlay-link" type="button" aria-label="Copiar enlace overlay">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path
                  d="M16 1H6C4.9 1 4 1.9 4 3V15H6V3H16V1ZM19 5H10C8.9 5 8 5.9 8 7V21C8 22.1 8.9 23 10 23H19C20.1 23 21 22.1 21 21V7C21 5.9 20.1 5 19 5ZM19 21H10V7H19V21Z"
                  fill="currentColor"
                />
              </svg>
            </button>
          </div>
          <label>Enlace controlador</label>
          <div class="link-row">
            <input id="controller-link" readonly />
            <button
              class="copy-btn"
              data-copy-target="controller-link"
              type="button"
              aria-label="Copiar enlace controlador"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path
                  d="M16 1H6C4.9 1 4 1.9 4 3V15H6V3H16V1ZM19 5H10C8.9 5 8 5.9 8 7V21C8 22.1 8.9 23 10 23H19C20.1 23 21 22.1 21 21V7C21 5.9 20.1 5 19 5ZM19 21H10V7H19V21Z"
                  fill="currentColor"
                />
              </svg>
            </button>
          </div>
        </div>
      </section>
    </main>

    <script src="/index.js"></script>
  </body>
</html>
